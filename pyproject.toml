[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cerberus"
version = "0.1.0"
description = "An AI SRE copilot that reads your agents' SigNoz telemetry and explains what broke, what it cost, and what to do."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CodeMuscle" }]
keywords = ["observability", "opentelemetry", "signoz", "llm", "sre", "ai-agents"]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[project.urls]
Repository = "https://github.com/CodeMuscle/cerberus"

[tool.hatch.build.targets.wheel]
packages = ["cerberus"]

# ---------------------------------------------------------------------------
# Ruff — lint + format (one tool)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, comprehensions, pyupgrade, simplify
select = ["E", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]  # line length handled by the formatter

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=cerberus --cov-report=term-missing"

[tool.coverage.run]
source = ["cerberus"]
omit = ["cerberus/api.py"]  # thin web layer, covered by live smoke not units

# ---------------------------------------------------------------------------
# Mypy — light, non-blocking type hints
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
